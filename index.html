<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>날개달기 조교방</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="조교방">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* 카톡 모양 + AI 교무실 현황판 색(10-25 「ai 교무실 색감 써 줘」, 「바탕은 흰색이고」, 10-26 「찐초 자리에 핑크」): 하양 바탕, 진한 초록 대신 핑크, 민트 나무 간판, 칠판색 출퇴근 줄,
   내 말풍선 연민트, 남의 말풍선 하양, 확인 부탁은 분홍 테두리. 글꼴은 현황판과 같은 내일은맑음(본문), 뉴트로감성(제목) */
@font-face { font-family: "NalgaeBody"; src: url("fonts/tt-regular.woff") format("woff"); font-weight: 400 500; font-display: swap; }
@font-face { font-family: "NalgaeBody"; src: url("fonts/tt-bold.woff") format("woff"); font-weight: 600 800; font-display: swap; }
@font-face { font-family: "NalgaeTitle"; src: url("fonts/newtro.woff") format("woff"); font-display: swap; }
:root {
  --room: #ffffff; --top: #ffffff; --wood-dark: #a8dcd7; --me: #e1f3f1; --other: #ffffff; --fg: #24403e; --muted: #5b817d;
  --line: #d3ece9; --panel: #ffffff; --soft: #f6faf9; --accent: #3e7a76; --accent-soft: #e1f3f1; --mint: #a8dcd7; --mint-soft: #e1f3f1; --mint-ink: #3e7a76;
  --board: #ffffff; --chalk-text: #24403e; --plum: #24403e; --chalk-soft: #f6faf9;
  --done: #3e7a76; --warn: #3e7a76; --warn-soft: #e1f3f1;
  --font-body: "NalgaeBody", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; --font-title: "NalgaeTitle", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #ffffff; color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #fff; border-bottom: 2px solid var(--mint); position: sticky; top: 0; z-index: 2; }
.top h1 { font-family: var(--font-title); font-weight: 400; font-size: 1.3rem; margin: 0; flex: 1; color: var(--fg); }
.top .me { font-size: 0.82rem; color: var(--fg); }
.tbtn { position: relative; border: 1px solid var(--line); background: #fff; color: var(--fg); border-radius: 999px; padding: 5px 13px; font-size: 0.88rem; font-weight: 600; }
.cnt { position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 0.72rem; line-height: 19px; text-align: center; }
.prog { display: grid; gap: 3px; padding: 8px 14px; background: var(--mint-soft); border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.prog .r { display: flex; gap: 8px; align-items: baseline; }
.prog .r b { flex: none; color: var(--accent); min-width: 2.2em; }
.prog .r span { white-space: pre-wrap; overflow-wrap: anywhere; }
.prog .h { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--muted); }
.attbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; background: var(--board); color: var(--chalk-text); font-size: 0.9rem; border-bottom: 1px solid var(--line); }
.attbar b { font-variant-numeric: tabular-nums; color: var(--plum); }
.attbar .warn { flex-basis: 100%; color: var(--warn); font-weight: 700; font-size: 0.85rem; }
.pbtn { border: 0; border-radius: 10px; padding: 7px 16px; background: var(--accent); color: #fff; font-weight: 700; }
.attbar .pbtn { background: var(--accent); color: #fff; }
.attbar .pbtn.alt { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
.pbtn.alt { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
.pbtn.pink { background: var(--warn); color: #fff; }
.pbtn:disabled { opacity: 0.5; cursor: default; }
.nav { display: flex; gap: 6px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); }
.nav button { position: relative; flex: 1; border: 2px solid var(--line); background: #fff; color: var(--muted); border-radius: 12px; padding: 7px 4px; font-weight: 700; }
.nav button[aria-selected="true"] { background: #fff; border-color: var(--accent); color: var(--accent); }
.page { flex: 1; overflow-y: auto; padding: 12px 12px 48px; display: grid; gap: 12px; align-content: start; background-color: var(--room); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 2px 6px; display: grid; justify-items: center; color: var(--fg); }
.tile b { font-family: var(--font-title); font-weight: 400; font-size: 1.7rem; line-height: 1.1; }
.tile span { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.tile.work { }
.tile.done { }
.tile.need { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tile.need span { color: var(--accent); font-weight: 700; }
.tile.on { border-color: var(--accent); }
.tags { display: inline-flex; gap: 6px; align-items: center; }
.pill { font-size: 0.72rem; padding: 1px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
.pill.wait { background: #fff; border: 1px solid var(--line); color: var(--muted); }
.pill.work { background: #fff; border: 1px solid var(--accent); color: var(--accent); }
.pill.done { background: #fff; border: 1px solid var(--line); color: var(--muted); }
.pill.need { background: var(--accent-soft); color: var(--accent); }
.card.done { background: var(--soft); }
.card.done { border-color: var(--accent); }
.card.done h3 > span:first-child { color: var(--muted); text-decoration: line-through; }
.card.need { border-color: var(--accent); }
.card.work { border-color: var(--accent); border-width: 2px; }
.pill.done { background: var(--accent); color: #fff; border: 0; }
.stline { font-size: 0.88rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; }
.stline.done { background: var(--accent); color: #fff; }
.stline.wait { background: #fff; border: 1px dashed var(--line); color: var(--muted); font-weight: 400; }
.saved { font-size: 0.82rem; color: var(--accent); font-weight: 700; }
.tags { flex-wrap: wrap; justify-content: flex-end; }
.ebtn { white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 2px 8px; font-size: 0.75rem; color: var(--muted); }
.room { flex: 1; overflow-y: auto; padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 6px; background-color: var(--room); }
.day { align-self: center; background: #fff; border: 1px solid var(--line); color: var(--muted); font-size: 0.78rem; padding: 3px 12px; border-radius: 999px; margin: 8px 0 4px; }
.m { display: flex; gap: 6px; align-items: flex-end; max-width: 86%; }
.m .col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.m .nm { font-size: 0.8rem; color: var(--muted); }
.m .b { background: var(--other); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 7px 11px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.93rem; }
.m .t { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
.m.mine { align-self: flex-end; flex-direction: row-reverse; }
.m.mine .b { background: var(--me); border-color: var(--line); border-radius: 14px 4px 14px 14px; }
.m .tag { display: block; font-size: 0.72rem; font-weight: 700; color: var(--warn); margin-bottom: 2px; }
.m.ask .b, .m.notdone .b { box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.m.auto .b { background: var(--soft); border-color: var(--line); color: var(--fg); font-size: 0.86rem; }
.m.mine.auto .b { background: var(--soft); border-color: var(--line); }
.m .res { font-size: 0.72rem; color: var(--done); }
.comp { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--line); }
.comp .row { display: flex; gap: 8px; align-items: flex-end; }
.comp textarea { flex: 1; font: inherit; font-size: 0.95rem; min-height: 40px; max-height: 120px; resize: none; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.comp .send { border: 0; background: var(--accent); color: #fff; font-family: var(--font-body); border-radius: 10px; padding: 9px 14px; font-weight: 700; }
.chip { align-self: flex-start; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 12px; font-size: 0.8rem; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: #fff; color: var(--accent); font-weight: 700; }
/* 덮는 판: 할 일, 원장님 */
.back { border: 0; background: none; font-weight: 700; color: var(--fg); padding: 4px 2px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 12px; font-size: 0.88rem; }
.tabs button[aria-pressed="true"] { background: #fff; color: var(--accent); border-color: var(--accent); font-weight: 700; }
.datenav { display: flex; align-items: center; gap: 8px; }
.datenav b { flex: 1; text-align: center; }
.datenav button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; }
.card { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.card.ok { background: var(--soft); border-color: var(--accent); }
.card.ok h3 .n { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 8px; font-weight: 700; }
.card.nd, .card.mv { border-color: var(--accent); }
.card h3 { margin: 0; font-size: 0.98rem; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.card h3 .n { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.badge { font-size: 0.72rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; white-space: nowrap; }
.note { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 0.9rem; white-space: pre-wrap; }
details.rules { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.86rem; white-space: pre-wrap; }
details.rules summary { font-weight: 700; cursor: pointer; }
.ln { display: flex; gap: 9px; align-items: flex-start; font-size: 0.9rem; cursor: pointer; }
.ln input[type="checkbox"] { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--done); flex: none; }
.ln .tm { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.4em; font-size: 0.85rem; }
/* 10-30 원장님 「시작 눌렀을 때 줄이 그어지고 완료하면 아무 표시도 안 나서 헷갈려」: 줄 긋기는 일 전체 완료에만 쓰고, 체크 줄은 굵은 글씨와 ✔로 */
.ln .x { color: var(--done); font-weight: 700; }
.ln .x::before { content: "✔ "; }
.fld { display: grid; gap: 3px; }
.fld .lb { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--muted); }
.fld .tx { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; max-height: 260px; overflow: auto; }
.copy { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 6px; padding: 1px 9px; font-size: 0.76rem; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
.need { font-size: 0.8rem; color: var(--warn); font-weight: 700; }
.hint { font-size: 0.8rem; color: var(--muted); }
textarea.memo, input.memo { width: 100%; font: inherit; font-size: 0.9rem; min-height: 40px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); resize: vertical; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 3px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
td.miss { color: var(--warn); font-weight: 700; }
.pay { background: var(--mint-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.pay .row { display: flex; justify-content: space-between; gap: 10px; }
.pay .total { font-weight: 700; font-size: 0.98rem; border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; }
.pay .q { color: var(--warn); font-size: 0.8rem; }
.fixrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; }
.fixrow input, .fixrow select { font: inherit; font-size: 0.85rem; padding: 3px 5px; border: 1px solid var(--line); border-radius: 6px; }
/* 로그인 */
.login { min-height: 100dvh; display: grid; place-content: center; gap: 14px; padding: 24px 16px; text-align: center; }
.login h1 { margin: 0; font-family: var(--font-title); font-weight: 400; font-size: 1.9rem; color: var(--mint-ink); }
.login .names { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.login .names button { border: 2px solid var(--wood-dark); background: #fff; color: var(--fg); border-radius: 14px; padding: 14px 18px; font-weight: 700; min-width: 92px; }
.login input { font-size: 1.4rem; letter-spacing: 0.4em; text-align: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; width: 220px; background: #fff; color: var(--fg); }
.login { background-color: var(--room); }
.err { color: #b3261e; font-weight: 700; font-size: 0.9rem; }
.empty { color: var(--muted); text-align: center; padding: 24px 10px; }
</style>
</head>
<body>
<div id="app" class="app"><div class="empty">불러오는 중이에요…</div></div>
<script>
/* ---------- 서버 부르기 ---------- */
/* 구글 안(앱스 스크립트 화면)에서는 google.script.run, 구글 밖(깃허브 페이지)에서는 fetch 로 같은 함수를 부른다.
   fetch 는 쿠키 없이 보내서, 휴대폰에 구글 계정이 로그인되어 있어도 막히지 않는다 */
const API = "https://script.google.com/macros/s/AKfycbyYr_tGkCQG0GH95S6TdNyOxzNxpO40OHq7wmODT7BQ-mmbkyfiLZXRBdI7IryC5N35xA/exec";
const R = (fn, ...args) => window.google && google.script && google.script.run
  ? new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args))
  : fetch(API, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) })
      .then(r => r.json()).then(j => { if (j.e) throw new Error(j.e); return j.r; });
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
let token = store.get("aide-token"), S = null, view = "home", sub = "day", filter = "", date = "", ver = "", lastId = 0, askToggle = false, outStep = "", attMonth = "", editAtt = "", busy = false;
const drafts = {};
const OWNER = "원장님", DAY = ["일", "월", "화", "수", "목", "금", "토"];

/* ---------- 작은 도우미 ---------- */
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v; else n.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
  return n;
};
const p2 = n => String(n).padStart(2, "0");
const ymd = t => { const d = new Date(t); return String(d.getFullYear()).slice(2) + p2(d.getMonth() + 1) + p2(d.getDate()); };
const hm = t => { const d = new Date(t); return p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const dateOf = (s, h = 0, m = 0) => new Date(2000 + +s.slice(0, 2), +s.slice(2, 4) - 1, +s.slice(4, 6), h, m);
const md = s => `${+s.slice(2, 4)}월 ${+s.slice(4, 6)}일 ${DAY[dateOf(s).getDay()]}요일`;
const dur = m => m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간` + (m % 60 ? ` ${m % 60}분` : "");
const won = n => Math.round(n).toLocaleString("ko-KR") + "원";
const addDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return ymd(d.getTime()); };
const isOwner = () => S && S.owner;
const mine = it => isOwner() || (S && S.me === "조교") || !it.who || it.who === "함께" || String(it.who).split(",").includes(S.me);
const dayOf = s => DAY[dateOf(s).getDay()];
async function call(fn, ...args) {
  try { const r = await R(fn, tk(), ...args); if (r && r.error) { alert(r.error); return null; } return r; }
  catch (e) { const em = String(e && e.message || e); if (em.includes("LOGIN")) { logout(); return null; } alert("저장하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요."); return null; }
}

/* ---------- 로그인 ---------- */
function logout() { token = null; store.set("aide-token", null); S = null; showLogin(); }
/* 조교 계정 하나를 같이 써요. 할 일, 출퇴근을 누를 때만 누가 했는지 이름을 붙여 보내요 */
let asName = "";
const tk = () => token + (asName ? "|" + asName : "");
async function callAs(name, fn, ...args) { asName = name || ""; try { return await call(fn, ...args); } finally { asName = ""; } }
async function actAs(name, fn, ...args) { busy = true; const r = await callAs(name, fn, ...args); busy = false; if (r) await load(); else { for (const k in saved) delete saved[k]; render(); } return r; }
const shared = () => S && S.me === "조교";
const doers = {}, saved = {};
/* 할 일 고치기: 이름 바꾸기, 비우면 지우기 */
async function editTask(d, it) {
  const v = prompt("할 일 이름을 고쳐 주세요.\n지우려면 칸을 비우고 확인을 눌러요.", it.title || "");
  if (v === null) return;
  const t = v.trim();
  if (t === (it.title || "").trim()) return;
  if (!t) return delTask(d, it);
  await act("api_editTask", d, it.id, t, false);
}
async function delTask(d, it) { if (confirm("「" + it.title + "」 일을 지울까요?")) await act("api_editTask", d, it.id, "", true); }
async function showLogin(picked, msg, setting) {
  const app = $("#app");
  if (!picked) {
    app.replaceChildren(el("div", { class: "login" }, el("h1", {}, "날개달기 조교방"), el("div", { class: "hint" }, "이름을 눌러 주세요"), el("div", { class: "empty" }, "불러오는 중…")));
    let people = [];
    try { people = await R("api_people"); } catch (e) { app.querySelector(".empty").textContent = "연결하지 못했어요. 새로고침해 주세요."; return; }
    app.replaceChildren(el("div", { class: "login" }, el("h1", {}, "날개달기 조교방"), el("div", { class: "hint" }, "이름을 눌러 주세요"),
      el("div", { class: "names" }, ...people.map(p => el("button", { type: "button", onclick: p.noPin ? async e => {
        e.target.disabled = true;
        const r = await R("api_login", p.name, "").catch(() => ({ error: "연결하지 못했어요. 새로고침해 주세요." }));
        if (r.error) { e.target.disabled = false; alert(r.error); return; }
        token = r.token; store.set("aide-token", token); start();
      } : () => showLogin(p.name, "", !p.hasPin) }, p.name)))));
    return;

/* 출퇴근과 급여: 쉬는 시간은 퇴근 때 고른 만큼 빼고, 주휴수당은 4주 평균 1주 15시간 이상이고 근무 요일을 다 나온 주만(근로기준법 제18조 3항, 제55조) */
